spring.application.name=clinica
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=clinica;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
# Senha de conexão com o banco de dados SQL Server (altere conforme sua instalação local)
spring.datasource.password=02032007

# O Spring Boot (Hibernate/JPA) cria e atualiza automaticamente as tabelas no SQL Server.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Segurança da API (token assinado com HMAC-SHA256)
# Em produção defina a variável de ambiente APP_TOKEN_SECRET (mínimo 32 caracteres).
app.security.token-secret=${APP_TOKEN_SECRET:hbsaude-clinica-chave-secreta-de-desenvolvimento-2026}
# Validade do token de login, em minutos (480 = 8 horas)
app.security.token-ttl-minutes=480
